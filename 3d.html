<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="/">
<meta name="robots" content="noindex">
<!-- =============================================================
     EKSPERIMEN 3D v3 — "Jalan Menuju Hari Bahagia".
     BUKAN pengganti index.html: halaman tamu lain tidak disentuh.
     Satu file, tanpa bundler; Three.js dari CDN. Data tenant 'root'
     via assets/js/config.js + supabase-client.js + photos.js
     (RPC get_invitation → localStorage → config lokal).

     Konsep: perjalanan first-person POV LINEAR — navigasi HANYA
     scroll/swipe vertikal (maju/mundur sepanjang jalur), tanpa
     drag-lihat-sekeliling. Urutan checkpoint SAMA PERSIS dengan
     section index.html: Cover (tombol buka undangan) → opening
     (ayat + foto) → mempelai ×2 → save-the-date → acara →
     livestream → quote → cerita cinta → quotes → galeri → gift →
     rsvp → closing. Begitu kamera tiba di sebuah checkpoint,
     panel info-nya OTOMATIS terbuka; ditutup → lanjut scroll.
     Vibe cerah kartun-ilustratif, lanjutan versi rumah sebelumnya.
     ============================================================= -->
<title>Mita &amp; Andi — Perjalanan 3D</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root {
    --ink: #4a3728;
    --coral: #ff8a65;
    --teal: #26b5a2;
    --sun: #ffc94d;
    --panel-bg: #fffaf0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #bfe7f7 0%, #e8f7d4 100%);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* Scroll terjadi pada wrapper tinggi-penuh ini — halaman 3D sendiri fixed. */
  #scroller {
    position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; z-index: 5;
    scroll-snap-type: y mandatory;
    scrollbar-width: none;
  }
  #scroller::-webkit-scrollbar { display: none; }
  #scroll-space { width: 1px; }
  .snap-seg {
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    pointer-events: none;
  }

  #stage { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* ---------- Progress rail ---------- */
  #rail {
    position: fixed; right: calc(env(safe-area-inset-right, 0px) + 10px); top: 50%;
    transform: translateY(-50%); z-index: 20;
    display: flex; flex-direction: column; gap: 9px; align-items: center;
  }
  .rail-dot {
    width: 10px; height: 10px; border-radius: 999px;
    background: rgba(255,255,255,.75);
    box-shadow: 0 0 0 2px rgba(74,55,40,.25);
    transition: background .3s ease, transform .3s ease;
  }
  .rail-dot.active { background: var(--coral); transform: scale(1.45); }

  /* ---------- Hint bawah ---------- */
  #hint {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateX(-50%); z-index: 20;
    background: rgba(255,250,240,.92); color: var(--ink);
    font-weight: 700; font-size: 13px; padding: 8px 18px; border-radius: 999px;
    box-shadow: 0 4px 14px rgba(74,55,40,.22);
    transition: opacity .5s ease;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }

  /* ---------- Layar pembuka ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 12px;
    background:
      radial-gradient(90% 60% at 50% -10%, rgba(255,201,77,.55), transparent 60%),
      radial-gradient(120% 80% at 50% 110%, rgba(38,181,162,.35), transparent 55%),
      linear-gradient(180deg, #fdf3e0 0%, #ffe8cf 100%);
    transition: opacity .5s ease, visibility .5s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro h1 { font-size: clamp(32px, 9vw, 54px); font-weight: 800; line-height: 1.1; color: var(--coral); }
  #intro p { font-size: clamp(15px, 4vw, 18px); font-weight: 600; max-width: 430px; }
  #enterBtn {
    margin-top: 8px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 18px; color: #fff;
    padding: 16px 40px; border-radius: 999px;
    background: linear-gradient(180deg, var(--coral), #f07048);
    box-shadow: 0 6px 0 #c85a38, 0 12px 24px rgba(200,90,56,.35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #enterBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c85a38; }
  #introHint { font-size: 13px; font-weight: 600; opacity: .65; }

  /* ---------- Panel info otomatis ---------- */
  #panelWrap {
    position: fixed; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    padding: 18px; visibility: hidden;
  }
  #panelWrap.open { visibility: visible; }
  /* Panel menutupi scroll: backdrop menerima wheel/touch agar konten
     tidak melompat saat panel terbuka. */
  #panelBackdrop {
    position: absolute; inset: 0;
    background: rgba(74,55,40,.45);
    opacity: 0; transition: opacity .3s ease;
    touch-action: none;
  }
  #panelWrap.open #panelBackdrop { opacity: 1; }
  #panel {
    position: relative; width: min(480px, 100%); max-height: 74vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel-bg); border-radius: 24px;
    padding: 22px 20px 20px;
    box-shadow: 0 10px 0 rgba(74,55,40,.12), 0 24px 48px rgba(74,55,40,.3);
    transform: translateY(28px) scale(.96); opacity: 0;
    transition: transform .32s cubic-bezier(.34,1.4,.64,1), opacity .25s ease;
  }
  #panelWrap.open #panel { transform: none; opacity: 1; }
  #panelClose {
    position: sticky; top: 0; float: right; margin: -6px -6px 0 8px;
    width: 36px; height: 36px; border: none; border-radius: 50%;
    background: var(--sun); color: var(--ink); font-weight: 800; font-size: 17px;
    cursor: pointer; box-shadow: 0 3px 0 #d9a52e;
    font-family: inherit; z-index: 2;
  }
  #panelKicker {
    display: inline-block; font-size: 12px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: var(--teal);
    padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  #panelBody h2 { font-size: 23px; font-weight: 800; color: var(--coral); margin-bottom: 8px; line-height: 1.2; }
  #panelBody img.panel-photo {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 16px; margin-bottom: 12px;
    border: 4px solid #fff; box-shadow: 0 4px 14px rgba(74,55,40,.2);
  }
  #panelBody img.gallery-thumb {
    width: 31%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 12px; margin: 0 2% 8px 0;
    border: 3px solid #fff; box-shadow: 0 3px 10px rgba(74,55,40,.18);
  }
  #panelBody p { font-size: 15.5px; font-weight: 600; line-height: 1.55; margin-bottom: 8px; }
  #panelBody blockquote {
    font-style: italic; font-weight: 700; font-size: 17px; line-height: 1.5;
    color: var(--teal); text-align: center; padding: 6px 8px;
  }
  #panelBody .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  #panelBody .chip {
    background: #fff2d6; border-radius: 10px; padding: 6px 10px;
    font-size: 13px; font-weight: 700;
  }
  #panelBody a.mapsLink {
    display: inline-block; margin-top: 8px; text-decoration: none;
    color: #fff; background: var(--teal); font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 4px 0 #17897b;
  }
  #panelBody .arabic {
    font-size: 26px; text-align: center; direction: rtl; line-height: 1.9;
    margin-bottom: 8px;
  }
  #panelBody .story-item { margin-bottom: 12px; }
  #panelBody .story-date { color: var(--teal); font-weight: 800; font-size: 13px; letter-spacing: .04em; }
</style>
</head>
<body>

<div id="stage"></div>

<!-- Wrapper scroll: memberi ruang vertikal untuk swipe -->
<div id="scroller"><div id="scroll-space"></div></div>

<!-- Rail progres checkpoint -->
<div id="rail"></div>

<div id="hint">Geser ke atas untuk berjalan 👆</div>

<!-- Layar pembuka -->
<div id="intro">
  <h1>Mita &amp; Andi</h1>
  <p>Ikuti jalan kami menuju hari bahagia. Geser layar ke atas untuk melangkah maju — setiap posisi akan membuka ceritanya sendiri.</p>
  <button id="enterBtn">Mulai Perjalanan</button>
  <span id="introHint">Cukup satu jari — geser atas/bawah 📱</span>
</div>

<!-- Panel info -->
<div id="panelWrap" role="dialog" aria-modal="true">
  <div id="panelBackdrop"></div>
  <div id="panel">
    <button id="panelClose" aria-label="Tutup">✕</button>
    <span id="panelKicker"></span>
    <div id="panelBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/supabase@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/tenant.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/photos.js"></script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= Data undangan ================= */

const cfg = window.WEDDING_CONFIG;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function photoList(folder, fallbackPaths) {
  const list = await window.getPhotos(folder);
  const out = [];
  if (list && list.length) {
    for (const p of list) out.push(window.photoUrl(p.path));
  } else if (fallbackPaths && fallbackPaths.length) {
    out.push(...fallbackPaths.filter(Boolean));
  }
  return out;
}

function loadTexture(url) {
  return new Promise((resolve) => {
    new THREE.TextureLoader().load(url, (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace; resolve(tex);
    }, undefined, () => resolve(null));
  });
}

/* ================= Scene dasar ================= */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfeef9'); // langit siang cerah
scene.fog = new THREE.Fog('#cfeef9', 26, 58);

// Kamera POV: selalu menghadap -Z sepanjang jalur, sedikit bobbing saat jalan.
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 120);

scene.add(new THREE.AmbientLight(0xfff2dd, 1.05));
const sun = new THREE.DirectionalLight(0xffeec2, 1.4);
sun.position.set(8, 14, 6);
scene.add(sun);

const MAT = {
  path:   new THREE.MeshLambertMaterial({ color: '#f2cf9a' }),   // jalan setapak pasir
  grassA: new THREE.MeshLambertMaterial({ color: '#a5dc86' }),
  grassB: new THREE.MeshLambertMaterial({ color: '#93cf72' }),
  trunk:  new THREE.MeshLambertMaterial({ color: '#a86a3d' }),
  leaf:   new THREE.MeshLambertMaterial({ color: '#57cc99' }),
  arch:   new THREE.MeshLambertMaterial({ color: '#ff8a65' }),
  archAlt:new THREE.MeshLambertMaterial({ color: '#26b5a2' }),
  post:   new THREE.MeshLambertMaterial({ color: '#ffffff' }),
  flowerA:new THREE.MeshBasicMaterial({ color: '#ff6b81' }),
  flowerB:new THREE.MeshBasicMaterial({ color: '#ffd166' }),
  flowerC:new THREE.MeshBasicMaterial({ color: '#ba68c8' }),
  cloud:  new THREE.MeshLambertMaterial({ color: '#ffffff' }),
  gateWood:new THREE.MeshLambertMaterial({ color: '#c98a4b' })
};

const rand = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(42);

function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
function cyl(rt, rb, h, seg, mat) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); }
function sphere(r, mat, w = 14, hh = 10) { return new THREE.Mesh(new THREE.SphereGeometry(r, w, hh), mat); }

/* ================= Dunia: jalur lurus sepanjang Z negatif =================

   Jalur dari z=0 (Cover) ke z=-CHECK_SPACING*(N-1). Tiap checkpoint punya
   gapura lengkung + papan nama + dekorasi unik. Rumput dua sisi bergantian
   warna (strip ala kartun). Pohon & bunga tersebar acak deterministik.   */

const CHECKPOINTS = []; // diisi buildCheckpoints(): { z, key, label }
const CHECK_SPACING = 16;

// Ground panjang: strip rumput + jalan tengah
{
  const LEN = 320;
  // rumput kiri/kanan berselang-seling warna per strip 8m — vibe kartun
  for (let i = 0; i < LEN / 8; i++) {
    const side = i % 2 ? MAT.grassA : MAT.grassB;
    const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 8), side);
    g.rotation.x = -Math.PI / 2;
    g.position.set(0, 0, -(i * 8) - 4);
    scene.add(g);
  }
  const road = new THREE.Mesh(new THREE.PlaneGeometry(4.4, LEN), MAT.path);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.02, -LEN / 2 + 40);
  scene.add(road);
}

// Pohon & bunga pinggir jalan
function tree(x, z, s = 1) {
  const g = new THREE.Group();
  const trunk = cyl(0.18 * s, 0.26 * s, 1.6 * s, 8, MAT.trunk);
  trunk.position.y = 0.8 * s;
  g.add(trunk);
  [[0, 2.1 * s, 0, 1.05], [0.55 * s, 1.65 * s, 0.2, 0.62], [-0.5 * s, 1.75 * s, -0.15, 0.66]].forEach(([x2, y2, z2, r]) => {
    const puff = sphere(r * s, MAT.leaf);
    puff.position.set(x2, y2, z2);
    puff.scale.y = 0.92;
    g.add(puff);
  });
  g.position.set(x, 0, z);
  return g;
}
function flower(x, z) {
  const stem = cyl(0.02, 0.02, 0.34, 5, MAT.leaf);
  stem.position.set(x, 0.17, z);
  scene.add(stem);
  const head = sphere(0.11, [MAT.flowerA, MAT.flowerB, MAT.flowerC][Math.floor(rand() * 3)], 8, 6);
  head.position.set(x, 0.42, z);
  scene.add(head);
}
for (let z = 4; z > -290; z -= 3.2) {
  [-1, 1].forEach((side) => {
    if (rand() < 0.5) flower(side * (2.8 + rand() * 1.4), z - rand() * 2);
    if (rand() < 0.42) scene.add(tree(side * (5 + rand() * 3), z - rand() * 2.5, 0.85 + rand() * 0.5));
  });
}

// Awan mengapung
const clouds = [];
for (let i = 0; i < 12; i++) {
  const cl = new THREE.Group();
  const cm = MAT.cloud;
  [[0, 0, 0, 0.9], [1.1, -0.15, 0.2, 0.6], [-1.05, -0.1, -0.15, 0.55], [0.4, 0.5, 0, 0.55]].forEach(([x, y, z, r]) => {
    const puff = sphere(r, cm);
    puff.position.set(x, y, z);
    cl.add(puff);
  });
  cl.position.set(-24 + rand() * 48, 10 + rand() * 6, 10 - rand() * 300);
  cl.userData.baseY = cl.position.y;
  cl.userData.speed = 0.15 + rand() * 0.2;
  scene.add(cl);
  clouds.push(cl);
}

/* ---- Gapura checkpoint: dua tiang + lengkung + papan label ---- */

const labelCanvasTex = (() => {
  const cache = {};
  return (text) => {
    if (cache[text]) return cache[text];
    const c = document.createElement('canvas');
    c.width = 512; c.height = 128;
    const x = c.getContext('2d');
    x.fillStyle = '#fffaf0';
    x.beginPath();
    x.roundRect(6, 14, 500, 100, 28);
    x.fill();
    x.strokeStyle = '#ff8a65'; x.lineWidth = 8;
    x.stroke();
    x.fillStyle = '#4a3728';
    x.font = '800 44px "Baloo 2", sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(text, 256, 68, 450);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    cache[text] = tex;
    return tex;
  };
})();

function makeGate(label, idx) {
  const g = new THREE.Group();
  const mat = idx % 2 ? MAT.archAlt : MAT.arch;
  [-1.7, 1.7].forEach((x) => {
    const post = cyl(0.14, 0.18, 3.1, 10, MAT.post);
    post.position.set(x, 1.55, 0);
    g.add(post);
    const ball = sphere(0.22, mat);
    ball.position.set(x, 3.2, 0);
    g.add(ball);
  });
  const arc = new THREE.Mesh(new THREE.TorusGeometry(1.7, 0.12, 10, 40, Math.PI), mat);
  arc.position.y = 3.1;
  g.add(arc);
  // Papan label di atas lengkung
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(3.4, 0.85),
    new THREE.MeshBasicMaterial({ map: labelCanvasTex(label), transparent: false })
  );
  sign.position.set(0, 4.15, 0);
  g.add(sign);
  const signBack = box(3.5, 0.95, 0.08, MAT.gateWood);
  signBack.position.set(0, 4.15, -0.05);
  g.add(signBack);
  return g;
}

/** Bunga rangkaian di kedua sisi gapura (dekorasi tiang tambahan). */
function garland(gate, y) {
  [MAT.flowerA, MAT.flowerB, MAT.flowerC].forEach((m, i) => {
    [-1.7, 1.7].forEach((x) => {
      const f = sphere(0.09, m, 8, 6);
      f.position.set(x + (i - 1) * 0.12, y - i * 0.16, 0.14);
      gate.add(f);
    });
  });
}

/* ================= Konten panel per checkpoint ================= */

const panels = {}; // key → { kicker, title, html?, photoUrl?, photoUrls? }

function chipRow(pairs) {
  return `<div class="row">${pairs.map(([t]) => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
}

window.__panelsReady = (async function buildPanels() {
  const ev = cfg.event || {};
  const akad = ev.akad || {}, rsp = ev.resepsi || {};
  const story = Array.isArray(cfg.loveStory) ? cfg.loveStory : [];
  const op = cfg.opening || {};

  // 01 cover — dibuka via tombol (bukan isi panel; checkpoint tetap ada utk rail)
  panels.cover = {
    kicker: 'Cover',
    title: `${cfg.couple.bride.nickname} & ${cfg.couple.groom.nickname}`,
    html: `<p style="text-align:center">Undangan pernikahan ${esc(cfg.couple.bride.name)} &amp; ${esc(cfg.couple.groom.name)}.</p>
           ${chipRow([[ev.dayLabel || '', ev.dateLabel || '']])}
           <p style="font-size:13px;opacity:.7;text-align:center">Geser ke atas untuk memulai perjalanan ⤴</p>`
  };

  // 02 opening — ayat + foto
  const openPhotos = await photoList('opening');
  panels.opening = {
    kicker: 'Save The Date',
    title: 'Bismillah',
    photoUrl: openPhotos[0] || '',
    html: `${op.arabicQuote ? `<p class="arabic">${esc(op.arabicQuote)}</p>` : ''}
           ${op.quote ? `<blockquote>${esc(op.quote)}<br><span style="font-size:13px">${esc(op.source || '')}</span></blockquote>` : ''}
           ${chipRow([`${ev.dayLabel || ''}, ${ev.dateLabel || ''}`])}`
  };

  // 03 couple-bride
  const bridePhotos = await photoList('bride', [cfg.couple.bride.photo]);
  panels['couple-bride'] = {
    kicker: 'Mempelai',
    title: cfg.couple.bride.nickname,
    photoUrl: bridePhotos[0] || '',
    html: `<p><strong>${esc(cfg.couple.bride.name)}</strong></p>
           <p>Putri dari pasangan ${esc(cfg.couple.bride.father)} &amp; ${esc(cfg.couple.bride.mother)}.</p>`
  };

  // 04 couple-groom
  const groomPhotos = await photoList('groom', [cfg.couple.groom.photo]);
  panels['couple-groom'] = {
    kicker: 'Mempelai',
    title: cfg.couple.groom.nickname,
    photoUrl: groomPhotos[0] || '',
    html: `<p><strong>${esc(cfg.couple.groom.name)}</strong></p>
           <p>Putra dari pasangan ${esc(cfg.couple.groom.father)} &amp; ${esc(cfg.couple.groom.mother)}.</p>`
  };

  // 05 save-the-date-2 — hitung mundur singkat (hari saja)
  panels['save-the-date-2'] = {
    kicker: 'Save The Date',
    title: 'Menuju Hari Bahagia',
    html: (() => {
      let daysLeft = '';
      try {
        const target = new Date(ev.countdownTarget || ev.dateISO);
        const diff = Math.ceil((target - Date.now()) / 86400000);
        if (!isNaN(diff)) daysLeft = diff > 0 ? `⏳ ${diff} hari lagi` : '🎉 Hari telah tiba!';
      } catch (_) {}
      return `<p>Dengan memohon doa restu, kami menantikan hari bahagia:</p>
        ${chipRow([[ev.dayLabel || '', ev.dateLabel || '', daysLeft]])}`;
    })()
  };

  // 06 event — akad & resepsi + Maps
  panels.event = {
    kicker: 'Info Acara',
    title: 'Akad & Resepsi',
    html: `
      ${chipRow([`📖 Akad Nikah`, `${akad.start || ''}–${akad.end || ''}`])}
      <p>${esc((akad.venue && akad.venue.name) || '')}<br><small>${esc((akad.venue && akad.venue.address) || '')}</small></p>
      ${chipRow([`🎉 Resepsi`, `${rsp.start || ''}–${rsp.end || ''}`])}
      <p>${esc((rsp.venue && rsp.venue.name) || '')}<br><small>${esc((rsp.venue && rsp.venue.address) || '')}</small></p>
      ${(rsp.venue && rsp.venue.mapsUrl) ? `<a class="mapsLink" href="${esc(rsp.venue.mapsUrl)}" target="_blank" rel="noopener">📍 Buka Google Maps</a>` : ''}`
  };

  // 07 livestream
  const ls = cfg.livestream || {};

  panels.livestream = {

      : `<p>Saat ini tidak ada jadwal siaran langsung. Namun doa Anda tetap bisa menyertai dari mana saja. 🤲</p>`
  };

  // 08 quote
  panels.quote = {
    kicker: 'Quote',
    title: '',
    html: `<blockquote>${esc(cfg.quotePhoto.quote)}</blockquote>`
  };

  // 09 love-story
  const storyPhotos = await photoList('story', story.map((s) => s.photo));
  panels['love-story'] = {
    kicker: 'Our Story',
    title: 'Perjalanan Kami',
    html: story.map((s, i) =>
      `<div class="story-item">
         <span class="story-date">${esc(s.date)}</span>
         <h2 style="font-size:19px">${esc(s.title)}</h2>
         ${storyPhotos[i] ? `<img class="gallery-thumb" src="${esc(storyPhotos[i])}" alt="${esc(s.title)}">` : ''}
         <p>${esc(s.text)}</p>
       </div>`
    ).join('')
  };

  // 10 quotes
  panels.quotes = {
    kicker: 'Quotes',
    title: '',
    html: `<blockquote>“Finding home not in a place, but in a person.”</blockquote>`
  };

  // 11 gallery
  const galPhotos = await photoList('gallery');
  panels.gallery = {
    kicker: 'Moments',
    title: 'Galeri Foto',
    html: galPhotos.length
      ? galPhotos.slice(0, 12).map((u) => `<img class="gallery-thumb" src="${esc(u)}" alt="Galeri">`).join('')
      : '<p>Galeri akan segera hadir.</p>'

  // 12 gift
  const accs = (cfg.gift && cfg.gift.accounts) || [];
  panels.gift = {

      accs.map((a) => chipRow([[`${a.bank} a.n. ${a.holder}`, a.number]])).join('') +
      ((cfg.gift && cfg.gift.address && cfg.gift.address.recipient)
        ? `<p><strong>Kirim kado ke:</strong><br>${esc(cfg.gift.address.recipient)} — ${esc(cfg.gift.address.phone || '')}</p>`
        : '')
  };

  // 13 rsvp
  panels.rsvp = {
    kicker: 'RSVP',
    title: 'Doa & Ucapan',
    html: `<p>Doa baik dan ucapan hangat dari orang-oranng terkasih adalah bekal terindah bagi kami.</p>
           <p style="opacity:.7;font-size:13px">Formulir RSVP lengkap tersedia di halaman undangan utama.</p>`
  };

  // 14 closing
  const closePhotos = await photoList('closing');
  panels.closing = {
    kicker: 'Penutup',
    title: 'Sampai Jumpa',
    photoUrl: closePhotos[0] || '',
    html: `<p>${esc(cfg.closing.text)}</p>
           <p style="text-align:center;font-size:22px;color:var(--coral);font-weight:800">
             ${esc(cfg.couple.bride.nickname)} &amp; ${esc(cfg.couple.groom.nickname)} 💛</p>`

})();

/* ---- Susun urutan checkpoint = urutan section index.html ---- */

const ORDER = [
  ['cover', 'Cover'],
  ['opening', 'Ayat & Foto'],
  ['couple-bride', 'Mempelai — Mita'],
  ['couple-groom', 'Mempelai — Andi'],
  ['save-the-date-2', 'Save The Date'],
  ['event', 'Acara'],
  ['livestream', 'Live'],
  ['quote', 'Quote'],
  ['love-story', 'Cerita Kami'],
  ['quotes', 'Quotes'],
  ['gallery', 'Galeri'],
  ['gift', 'Hadiah'],
  ['rsvp', 'RSVP'],
  ['closing', 'Penutup']
];
ORDER.forEach(([key, label], i) => {
  CHECKPOINTS.push({ key, label, z: -i * CHECK_SPACING });
});

/* ---- Bangun gapura tiap checkpoint ---- */

(async function buildGates() {
  await window.__panelsReady;
  CHECKPOINTS.forEach(({ z, label }, i) => {
    const gate = makeGate(label, i);
    gate.position.set(0, 0, z);
    garland(gate, 2.9);
    scene.add(gate);
  });
})();

/* ================= Kontrol scroll (wheel + sentuh) ================= */

const scroller = document.getElementById('scroller');
const scrollSpace = document.getElementById('scroll-space');

const MAX_STEP = CHECKPOINTS.length - 1;

// Satu anak setinggi layar per checkpoint + CSS scroll-snap mandatory:
// swipe di HP otomatis "menempel" ke checkpoint terdekat (native, halus).
scrollSpace.innerHTML = CHECKPOINTS.map((c) =>
  `<div class="snap-seg" data-step="${CHECKPOINTS.indexOf(c)}"></div>`
).join('');

let currentStep = 0;        // checkpoint aktif (integer)
let currentTravel = 0;      // posisi kontinu 0..MAX_STEP untuk kamera
const camBaseY = 1.55;
const camCurrent = { z: 0 };
let autoOpenedFor = -1;     // step yang panelnya sudah pernah terbuka otomatis
let suppressScroll = false; // saat panel terbuka, abaikan input scroll

// --- Wheel tetap didukung (desktop): default scroll pada #scroller sudah jalan;
//     tak perlu handler tambahan. ---

// --- Scroll → deteksi checkpoint ---
scroller.addEventListener('scroll', () => {
  if (suppressScroll) {
    const lockPos = currentStep * innerHeight;
    if (Math.abs(scroller.scrollTop - lockPos) > 2) scroller.scrollTop = lockPos;
    return;
  }
  currentTravel = scroller.scrollTop / innerHeight;
  const step = Math.round(currentTravel);
  const clamped = Math.max(0, Math.min(MAX_STEP, step));
  if (clamped !== autoOpenedFor) {
    // Snap-sedang-berjalan: hanya buka kalau sudah dekat posisi final
    if (Math.abs(scroller.scrollTop - clamped * innerHeight) < innerHeight * 0.25) {
      arriveAt(clamped);
    }
  }
});

function arriveAt(step) {
  currentStep = step;
  autoOpenedFor = step;
  updateRail();
  openPanel(CHECKPOINTS[step].key);
}

/* ================= Panel ================= */

const panelWrap = document.getElementById('panelWrap');
const panelBody = document.getElementById('panelBody');
const panelKicker = document.getElementById('panelKicker');

async function openPanel(key) {
  await window.__panelsReady;
  const d = panels[key];
  if (!d) return;
  panelKicker.textContent = d.kicker;
  panelBody.innerHTML = '';
  if (d.title) {
    const h2 = document.createElement('h2');
    h2.textContent = d.title;
    panelBody.appendChild(h2);
  }
  if (d.photoUrl) {
    const img = document.createElement('img');
    img.className = 'panel-photo';
    img.src = d.photoUrl;
    img.alt = d.title || d.kicker;
    panelBody.appendChild(img);
  }
  const frag = document.createElement('div');
  frag.innerHTML = d.html || '';
  panelBody.appendChild(frag);
  suppressScroll = true;
  panelWrap.classList.add('open');
  document.getElementById('hint').classList.add('hidden');
}

function closePanel() {
  panelWrap.classList.remove('open');
  suppressScroll = false;
  document.getElementById('hint').classList.remove('hidden');
}
document.getElementById('panelClose').addEventListener('click', closePanel);
document.getElementById('panelBackdrop').addEventListener('click', closePanel);

/* ================= Rail progres ================= */

const railEl = document.getElementById('rail');
ORDER.forEach(() => {
  const dot = document.createElement('span');
  dot.className = 'rail-dot';
  railEl.appendChild(dot);
});
function updateRail() {
  [...railEl.children].forEach((dot, i) => dot.classList.toggle('active', i === currentStep));
}
updateRail();

/* ================= Loop animasi ================= */

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;

  // Kamera mengikuti scroll dengan lerp halus — perjalanan terasa "berjalan",
  // bukan lompat, walau snap native-nya instan.
  const targetZ = -currentTravel * CHECK_SPACING;
  camCurrent.z += (targetZ - camCurrent.z) * (1 - Math.pow(0.002, dt));
  camera.position.set(0, camBaseY + Math.sin(t * 2.1) * 0.035, camCurrent.z);
  camera.lookAt(0, camBaseY, camCurrent.z - 10);

  // Awan drift
  clouds.forEach((cl) => {
    cl.position.x += cl.userData.speed * dt * 0.6;
    if (cl.position.x > 30) cl.position.x = -30;
    cl.position.y = cl.userData.baseY + Math.sin(t * 0.5 + cl.id) * 0.25;
  });

  renderer.render(scene, camera);
}

/* ================= Resize ================= */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  // snap-seg pakai 100dvh — resize ditangani CSS
});

/* ================= Enter ================= */

animate();

document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hidden');
});
</script>
