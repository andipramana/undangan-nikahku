<head>

<!-- =============================================================
     EKSPERIMEN 3D v2 — "Rumah Mita & Andi".
     BUKAN pengganti index.html: halaman tamu lain tidak disentuh.
     Satu file, tanpa bundler; Three.js dari CDN (pola sama dengan
     xlsx/jsQR/html2canvas di file lain). Data & foto tenant 'root'
     via assets/js/config.js + supabase-client.js + photos.js
     (RPC get_invitation → localStorage → config lokal).

     Konsep: ruang tamu kartun yang bisa dijelajahi — drag untuk
     melihat sekeliling (orbit), pinch/wheel untuk zoom. Objek
     interaktif (bingkai foto ×2 di dinding, meja dengan buku
     cerita & undangan) menyala saat disentuh; tap memunculkan
     panel info HTML bergaya kartun. Vibe CERAH, ilustratif.
     ============================================================= -->
<title>Mita &amp; Andi — Rumah 3D</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  :root {
    --ink: #4a3728;
    --cream: #fff6e9;
    --coral: #ff8a65;
    --teal: #26b5a2;
    --sun: #ffc94d;
    --panel-bg: #fffaf0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Baloo 2', 'Comic Sans MS', cursive, sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, #bfe7f7 0%, #e8f7d4 100%);
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }

  /* ---------- Layar pembuka ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px;
    background:
      radial-gradient(90% 60% at 50% -10%, rgba(255,201,77,.55), transparent 60%),
      radial-gradient(120% 80% at 50% 110%, rgba(38,181,162,.35), transparent 55%),
      linear-gradient(180deg, #fdf3e0 0%, #ffe8cf 100%);
    transition: opacity .5s ease, visibility .5s ease;
  }
  #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #intro h1 { font-size: clamp(34px, 9vw, 56px); font-weight: 800; line-height: 1.1; color: var(--coral); }
  #intro p  { font-size: clamp(15px, 4vw, 18px); font-weight: 600; max-width: 420px; }
  #enterBtn {
    margin-top: 10px; border: none; cursor: pointer;
    font-family: inherit; font-weight: 800; font-size: 18px; color: #fff;
    padding: 16px 40px; border-radius: 999px;
    background: linear-gradient(180deg, var(--coral), #f07048);
    box-shadow: 0 6px 0 #c85a38, 0 12px 24px rgba(200, 90, 56, .35);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #enterBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c85a38; }
  #introHint { font-size: 13px; font-weight: 600; opacity: .65; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 12px; right: 12px; z-index: 20;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; pointer-events: none;
  }
  .hud-card {
    pointer-events: auto;
    background: rgba(255, 250, 240, .92); border-radius: 18px;
    padding: 10px 16px; box-shadow: 0 4px 14px rgba(74, 55, 40, .18);
    font-weight: 700;
  }
  #hudTitle { font-size: 15px; color: var(--coral); }
  #hudTitle small { display: block; font-size: 11.5px; font-weight: 600; color: var(--ink); opacity: .75; }

  /* ---------- Panel info ---------- */
  #panelWrap {
    position: fixed; inset: 0; z-index: 25;
    display: flex; align-items: center; justify-content: center;
    padding: 18px; visibility: hidden;
  }
  #panelWrap.open { visibility: visible; }
  #panelBackdrop {
    position: absolute; inset: 0;
    background: rgba(74, 55, 40, .45);
    opacity: 0; transition: opacity .3s ease;
  }
  #panelWrap.open #panelBackdrop { opacity: 1; }
  #panel {
    position: relative; width: min(480px, 100%); max-height: 78vh;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--panel-bg); border-radius: 24px;
    padding: 22px 20px 20px;
    box-shadow: 0 10px 0 rgba(74,55,40,.12), 0 24px 48px rgba(74,55,40,.3);
    transform: translateY(28px) scale(.96); opacity: 0;
    transition: transform .32s cubic-bezier(.34,1.4,.64,1), opacity .25s ease;
  }
  #panelWrap.open #panel { transform: none; opacity: 1; }
  #panelClose {
    position: sticky; top: 0; float: right; margin: -6px -6px 0 8px;
    width: 36px; height: 36px; border: none; border-radius: 50%;
    background: var(--sun); color: var(--ink); font-weight: 800; font-size: 17px;
    cursor: pointer; box-shadow: 0 3px 0 #d9a52e;
    font-family: inherit; z-index: 2;
  }
  #panelKicker {
    display: inline-block; font-size: 12px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    color: #fff; background: var(--teal);
    padding: 4px 12px; border-radius: 999px; margin-bottom: 10px;
  }
  #panelBody h2 { font-size: 24px; font-weight: 800; color: var(--coral); margin-bottom: 8px; }
  #panelBody img.panel-photo {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border-radius: 16px; margin-bottom: 12px;
    border: 4px solid #fff; box-shadow: 0 4px 14px rgba(74,55,40,.2);
  }
  #panelBody p { font-size: 15.5px; font-weight: 600; line-height: 1.55; margin-bottom: 8px; }
  #panelBody .row { display: flex; gap: 8px; margin-bottom: 6px; }
  #panelBody .chip {
    background: #fff2d6; border-radius: 10px; padding: 6px 10px;
    font-size: 13px; font-weight: 700;
  }
  #panelBody a.mapsLink {
    display: inline-block; margin-top: 8px; text-decoration: none;
    color: #fff; background: var(--teal); font-weight: 800; font-size: 14px;
    padding: 10px 20px; border-radius: 999px; box-shadow: 0 4px 0 #17897b;
  }
</style>
</head>
<body>

<div id="stage"></div>

<!-- Layar pembuka -->
<div id="intro">
  <h1>Mita &amp; Andi</h1>
  <p>Selamat datang di rumah kami! Geser untuk melihat sekeliling ruangan, lalu sentuh bingkai foto atau benda di atas meja.</p>
  <button id="enterBtn">Masuk Rumah</button>
  <span id="introHint">Cocok dibuka di HP — cukup pakai satu jari 👆</span>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-card" id="hudTitle">Rumah Mita &amp; Andi<small>Geser = lihat sekeliling · cubit/zoom = perbesar · sentuh benda bercahaya ✨</small></div>
</div>

<!-- Panel info -->
<div id="panelWrap" role="dialog" aria-modal="true">
  <div id="panelBackdrop"></div>
  <div id="panel">
    <button id="panelClose" aria-label="Tutup">✕</button>
    <span id="panelKicker"></span>
    <div id="panelBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/supabase@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/tenant.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/photos.js"></script>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= Data undangan ================= */

const cfg = window.WEDDING_CONFIG;

/** Foto folder Supabase → URL publik, dengan cadangan path lokal config. */
async function photoList(folder, fallbackPaths) {
  const list = await window.getPhotos(folder);
  const out = [];
  if (list && list.length) {
    for (const p of list) out.push(window.photoUrl(p.path));
  } else if (fallbackPaths && fallbackPaths.length) {
    out.push(...fallbackPaths);
  }
  return out.filter(Boolean);
}

/** Muat tekstur dari URL; resolve null kalau gagal (jaringan lambat dsb). */
function loadTexture(url) {
  return new Promise((resolve) => {
    new THREE.TextureLoader().load(
      url,
      (tex) => { tex.colorSpace = THREE.SRGBColorSpace; resolve(tex); },
      undefined,
      () => resolve(null)
    );
  });
}

/* ================= Scene dasar ================= */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#bfe7f7');

// Kamera orbit manual: yaw/pitch/distance diputar mengelilingi pusat ruangan.
const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 100);

// Cahaya cerah khas ilustrasi: ambient kuat + matahari hangat.
scene.add(new THREE.AmbientLight(0xfff2dd, 1.05));
const sun = new THREE.DirectionalLight(0xffeec2, 1.5);
sun.position.set(6, 10, 4);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcdeeff, 0.5);
fill.position.set(-6, 4, -6);
scene.add(fill);

/* ================= Ukuran & material ruangan ================= */

const ROOM_W = 10, ROOM_D = 10, ROOM_H = 4.4;

const MAT = {
  wallBack:   new THREE.MeshLambertMaterial({ color: '#ffe9d6' }),
  wallSide:   new THREE.MeshLambertMaterial({ color: '#ffdcb8' }),
  floor:      new THREE.MeshLambertMaterial({ color: '#f7b98a' }),
  rug:        new THREE.MeshLambertMaterial({ color: '#8fd3c7' }),
  rugInner:   new THREE.MeshLambertMaterial({ color: '#bfe6dd' }),
  woodDark:   new THREE.MeshLambertMaterial({ color: '#a86a3d' }),
  woodLight:  new THREE.MeshLambertMaterial({ color: '#e8b04b' }),
  frameWood:  new THREE.MeshLambertMaterial({ color: '#c98a4b' }),
  bookCoverA: new THREE.MeshLambertMaterial({ color: '#ff8a65' }),
  bookCoverB: new THREE.MeshLambertMaterial({ color: '#5aa9e6' }),
  paper:      new THREE.MeshBasicMaterial({ color: '#fffdf5' }),
  sofa:       new THREE.MeshLambertMaterial({ color: '#ffb3c1' }),
  cushion:    new THREE.MeshLambertMaterial({ color: '#ffd166' }),
  plantPot:   new THREE.MeshLambertMaterial({ color: '#e07a5f' }),
  leaf:       new THREE.MeshLambertMaterial({ color: '#57cc99' }),
  windowFrame:new THREE.MeshLambertMaterial({ color: '#ffffff' })
};

function box(w, h, d, mat) {
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
}
function cyl(rt, rb, h, seg, mat) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
}

/* ================= Ruangan ================= */

const room = new THREE.Group();
scene.add(room);

// Lantai + karpet
{
  const floor = box(ROOM_W, 0.3, ROOM_D, MAT.floor);
  floor.position.y = -0.15;
  room.add(floor);
  const rug = cyl(2.6, 2.6, 0.06, 40, MAT.rug);
  rug.position.set(0, 0.03, 0.6);
  room.add(rug);
  const rugIn = cyl(1.7, 1.7, 0.08, 40, MAT.rugInner);
  rugIn.position.set(0, 0.04, 0.6);
  room.add(rugIn);
}

// Tiga dinding (belakang, kiri, kanan) — sisi depan terbuka biar kamera bebas
{
  const back = box(ROOM_W, ROOM_H, 0.3, MAT.wallBack);
  back.position.set(0, ROOM_H / 2, -ROOM_D / 2);
  room.add(back);
  const left = box(0.3, ROOM_H, ROOM_D, MAT.wallSide);
  left.position.set(-ROOM_W / 2, ROOM_H / 2, 0);
  room.add(left);
  const right = box(0.3, ROOM_H, ROOM_D, MAT.wallSide);
  right.position.set(ROOM_W / 2, ROOM_H / 2, 0);
  room.add(right);
  // Lis plafon warna krem agar tepi atas tidak kosong
  const cornice = box(ROOM_W + 0.3, 0.25, ROOM_D + 0.3, MAT.windowFrame);
  cornice.position.y = ROOM_H + 0.02;
  scene.add(cornice);
}

// Jendela besar di dinding belakang — "langit" biru + awan, sumber vibe cerah
let cloudGroup;
{
  const win = new THREE.Group();
  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(3.6, 2.2),
    new THREE.MeshBasicMaterial({ color: '#9adcf5' })
  );
  win.add(glass);
  const barsV = box(0.12, 2.3, 0.1, MAT.windowFrame);
  win.add(barsV);
  const barH = box(3.7, 0.12, 0.1, MAT.windowFrame);
  win.add(barH);
  // Bingkai luar
  [[-1.86, 0], [1.86, 0]].forEach(([x]) => {
    const f = box(0.14, 2.4, 0.14, MAT.windowFrame);
    f.position.x = x; win.add(f);
  });
  [[0, -1.14], [0, 1.14]].forEach(([, y]) => {
    const f = box(3.9, 0.14, 0.14, MAT.windowFrame);
    f.position.y = y; win.add(f);
  });
  win.position.set(0, 2.5, -ROOM_D / 2 + 0.22);
  room.add(win);

  // Awan kartun mengapit jendela di dalam dinding? Lebih mudah: dua pot awan
  // melayang di depan kaca (di dalam ruangan, sebagai dekorasi menggantung).
  cloudGroup = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const cloud = new THREE.Group();
    const cm = new THREE.MeshLambertMaterial({ color: '#ffffff' });
    [[0, 0, 0, 0.42], [0.34, -0.06, 0, 0.3], [-0.34, -0.05, 0, 0.27]].forEach(([x, y, z, r]) => {
      const puff = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), cm);
      puff.position.set(x, y, z);
      cloud.add(puff);
    });
    cloud.position.set(-3.2 + i * 3.2, 3.4 - (i % 2) * 0.4, -1.5);
    cloud.userData.baseY = cloud.position.y;
    cloudGroup.add(cloud);
  }
  scene.add(cloudGroup);
}

/* ================= Objek interaktif =================

  Tiap objek interaktif: group utama + "hitbox" transparan lebih besar
  supaya gampang ditap di HP, plus outline glow (mesh sedikit lebih besar,
  additive) yang hanya tampil pada hover/tap target pertama.            */

const interactives = []; // { hitbox, onClick, glow }
const raycaster = new THREE.Raycaster();

function makeInteractive(group, hitSize, onClick) {
  const [w, h, d] = hitSize;
  const hitbox = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
  );
  hitbox.userData.isHitbox = true;
  group.add(hitbox);
  interactives.push({ hitbox, onClick });
  return hitbox;
}

/** Tekstur foto ke plane berbingkai kayu, digantung di dinding. */
async function framedPhoto(url, w, h) {
  const g = new THREE.Group();
  const frame = box(w + 0.24, h + 0.24, 0.09, MAT.frameWood);
  g.add(frame);
  let tex = url ? await loadTexture(url) : null;
  if (!tex) tex = await loadTexture('assets/img/foto_story/01.jpg');
  const mat = tex
    ? new THREE.MeshBasicMaterial({ map: tex })
    : new THREE.MeshBasicMaterial({ color: '#ffffff' });
  const photo = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  photo.position.z = 0.055;
  g.add(photo);
  return g;
}

/** Meja kayu bulat kaki tunggal. */
function coffeeTable() {
  const g = new THREE.Group();
  const top = cyl(1.15, 1.15, 0.14, 28, MAT.woodLight);
  top.position.y = 0.72;
  g.add(top);
  const leg = cyl(0.12, 0.16, 0.66, 14, MAT.woodDark);
  leg.position.y = 0.33;
  g.add(leg);
  const base = cyl(0.5, 0.56, 0.08, 20, MAT.woodDark);
  base.position.y = 0.04;
  g.add(base);
  return g;
}

/** Buku terbuka sederhana: dua "halaman" miring + sampul. */
function openBook(coverMat) {
  const g = new THREE.Group();
  const cover = box(0.92, 0.05, 0.62, coverMat);
  g.add(cover);
  const pgGeo = new THREE.PlaneGeometry(0.84, 0.54);
  const left = new THREE.Mesh(pgGeo, MAT.paper);
  left.rotation.x = -Math.PI / 2;
  left.rotation.z = Math.PI / 2;
  left.position.set(-0.21, 0.035, 0);
  left.rotation.y = 0.06;
  g.add(left);
  const right = new THREE.Mesh(pgGeo, MAT.paper);
  right.rotation.x = -Math.PI / 2;
  right.rotation.z = Math.PI / 2;
  right.position.set(0.21, 0.035, 0);
  right.rotation.y = -0.06;
  g.add(right);
  return g;
}

/** Amplop undangan putih dengan segel hati. */
function envelope() {
  const g = new THREE.Group();
  const body = box(0.66, 0.03, 0.46, MAT.paper);
  g.add(body);
  const flap = new THREE.Mesh(new THREE.ConeGeometry(0.23, 0.2, 3), MAT.paper);
  flap.scale.z = 0.68;
  flap.position.set(0, 0.03, -0.115);
  g.add(flap);
  const heartCanvas = document.createElement('canvas');
  heartCanvas.width = heartCanvas.height = 64;
  const cx = heartCanvas.getContext('2d');
  cx.fillStyle = '#ff6b81';
  cx.font = '44px sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText('♥', 32, 34);
  const sealTex = new THREE.CanvasTexture(heartCanvas);
  const seal = new THREE.Mesh(
    new THREE.CircleGeometry(0.06, 20),
    new THREE.MeshBasicMaterial({ map: sealTex, transparent: true })
  );
  seal.rotation.x = -Math.PI / 2;
  seal.position.set(0, 0.04, -0.1);
  g.add(seal);
  return g;
}

/** Sofa kecil dua kursi (dekorasi, non-interaktif). */
function sofa() {
  const g = new THREE.Group();
  const seat = box(2.4, 0.42, 0.95, MAT.sofa); seat.position.y = 0.32; g.add(seat);
  const backr = box(2.4, 0.75, 0.25, MAT.sofa); backr.position.set(0, 0.82, -0.36); g.add(backr);
  [[-1.05], [1.05]].forEach(([x]) => {
    const arm = box(0.28, 0.6, 0.95, MAT.sofa); arm.position.set(x, 0.5, 0); g.add(arm);
  });
  [[-0.6, 0.1], [0.6, 0.1]].forEach(([x]) => {
    const c = box(0.5, 0.5, 0.16, MAT.cushion);
    c.rotation.x = -0.18; c.position.set(x, 0.72, -0.18);
    g.add(c);
  });
  [[-1, -0.38], [1, -0.38], [-1, 0.38], [1, 0.38]].forEach(([x, z]) => {
    const foot = cyl(0.06, 0.06, 0.14, 10, MAT.woodDark);
    foot.position.set(x, 0.07, z * 0.8); g.add(foot);
  });
  return g;
}

/** Tanaman pot (dekorasi). */
function plant() {
  const g = new THREE.Group();
  const pot = cyl(0.3, 0.22, 0.5, 16, MAT.plantPot); pot.position.y = 0.25; g.add(pot);
  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), MAT.leaf);
    leaf.scale.set(1, 1.5, 1);
    const a = (i / 7) * Math.PI * 2;
    leaf.position.set(Math.cos(a) * 0.16, 0.72 + (i % 3) * 0.16, Math.sin(a) * 0.16);
    g.add(leaf);
  }
  return g;
}

/* ---- Penempatan objek & wiring panel ---- */

const panelData = {}; // key → builder konten panel (fungsi async → html)

function openPanel(key) {
  const d = panelData[key];
  if (!d) return;
  buildPanel(d);
  document.getElementById('panelWrap').classList.add('open');
}
function closePanel() {
  document.getElementById('panelWrap').classList.remove('open');
}
document.getElementById('panelClose').addEventListener('click', closePanel);
document.getElementById('panelBackdrop').addEventListener('click', closePanel);

async function buildPanel(d) {
  document.getElementById('panelKicker').textContent = d.kicker;
  const body = document.getElementById('panelBody');
  body.innerHTML = '';
  const h2 = document.createElement('h2');
  h2.textContent = d.title;
  body.appendChild(h2);
  if (d.photoUrl) {
    const img = document.createElement('img');
    img.className = 'panel-photo';
    img.src = d.photoUrl;
    img.alt = d.title;
    body.appendChild(img);
  }
  const frag = document.createElement('div');
  frag.innerHTML = d.html || '';
  body.appendChild(frag);
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

window.__panelsReady = (async function populatePanels() {
  const ev = cfg.event || {};
  const akad = ev.akad || {}, rsp = ev.resepsi || {};
  const story = Array.isArray(cfg.loveStory) ? cfg.loveStory : [];

  // 1) BINGKAI FOTO KIRI — cerita cinta (foto babak pertama)
  const storyPhotos = await photoList('story', story.map((s) => s.photo));
  panelData.photoStory = {
    kicker: 'Cerita Kami',
    title: story[0] ? `${story[0].date} — ${esc(story[0].title)}` : 'Cerita Kami',
    photoUrl: storyPhotos[0] || '',
    html: (story[0] ? `<p>${esc(story[0].text)}</p>` : '') +
      story.slice(1).map((s) =>
        `<p><strong style="color:var(--teal)">${esc(s.date)} · ${esc(s.title)}</strong><br>${esc(s.text)}</p>`
      ).join('')
  };
  // 2) BINGKAI FOTO KANAN — foto pasangan (folder bride)
  const couplePhotos = await photoList('bride', [cfg.couple && cfg.couple.bride.photo]);
  panelData.photoCouple = {
    kicker: 'Kedua Mempelai',
    title: `${cfg.couple.bride.nickname} & ${cfg.couple.groom.nickname}`,
    photoUrl: couplePhotos[0] || '',
    html: `<p>${esc(cfg.couple.bride.name)}, putri dari pasangan
             ${esc(cfg.couple.bride.father)} &amp; ${esc(cfg.couple.bride.mother)}.</p>
           <p>${esc(cfg.couple.groom.name)}, putra dari pasangan
             ${esc(cfg.couple.groom.father)} &amp; ${esc(cfg.couple.groom.mother)}.</p>
           <div class="row"><span class="chip">💍 ${esc(ev.dateLabel || '')}</span></div>`
  };
  // 3) BUKU DI MEJA — info acara
  panelData.bookEvent = {
    kicker: 'Info Acara',
    title: 'Akad & Resepsi',
    html: `
      <div class="row"><span class="chip">📖 Akad Nikah</span><span class="chip">${esc(akad.start || '')}–${esc(akad.end || '')}</span></div>
      <p>${esc((akad.venue && akad.venue.name) || '')}<br><small>${esc((akad.venue && akad.venue.address) || '')}</small></p>
      <div class="row"><span class="chip">🎉 Resepsi</span><span class="chip">${esc(rsp.start || '')}–${esc(rsp.end || '')}</span></div>
      <p>${esc((rsp.venue && rsp.venue.name) || '')}<br><small>${esc((rsp.venue && rsp.venue.address) || '')}</small></p>
      ${(rsp.venue && rsp.venue.mapsUrl) ? `<a class="mapsLink" href="${esc(rsp.venue.mapsUrl)}" target="_blank" rel="noopener">📍 Buka Google Maps</a>` : ''}`
  };
  // 4) AMPLOP DI MEJA — tentang undangan 3D ini
  panelData.envelopeInfo = {
    kicker: 'Undangan',
    title: 'Tentang Undangan Ini',
    html: `<p>Undangan digital Mita &amp; Andi — ${esc(ev.dayLabel || '')}, ${esc(ev.dateLabel || '')}.</p>
           <p>Rumah mini ini adalah versi eksperimen Three.js: geser untuk melihat sekeliling,
              sentuh benda bercahaya untuk membuka cerita. Selamat menjelajah! 🏡</p>`
  };
  return panelData;
})();

/* ---- Build objek dunia (async karena tekstur foto) ---- */

(async function buildWorld() {
  await window.__panelsReady;
  // Sofa kiri-decor
  const sf = sofa();
  sf.position.set(-2.9, 0, -2.4);
  sf.rotation.y = Math.PI / 2 - 0.25;
  room.add(sf);

  // Tanaman pojok
  const pl = plant();
  pl.position.set(-3.9, 0, 3.4);
  room.add(pl);
  const pl2 = plant();
  pl2.position.set(3.9, 0, -3.4);
  pl2.scale.setScalar(1.15);
  room.add(pl2);

  // Meja tengah
  const table = coffeeTable();
  table.position.set(0, 0, 0.6);
  room.add(table);

  // BUKU CERITA di meja (interaktif)
  const book = openBook(MAT.bookCoverA);
  book.position.set(-0.28, 0.83, 0.6);
  book.rotation.y = 0.3;
  room.add(book);
  makeInteractive(book, [1.15, 0.35, 0.9], () => openPanel('bookEvent'));

  // AMPLOP di meja (interaktif)
  const envl = envelope();
  envl.position.set(0.42, 0.79, 0.75);
  envl.rotation.y = -0.4;
  room.add(envl);
  makeInteractive(envl, [0.95, 0.35, 0.8], () => openPanel('envelopeInfo'));

  // BINGKAI FOTO di dinding belakang (interaktif)
  const storyFrame = await framedPhoto(panelData.photoStory.photoUrl, 1.15, 0.85);
  storyFrame.position.set(-2.2, 2.35, -ROOM_D / 2 + 0.22);
  room.add(storyFrame);
  makeInteractive(storyFrame, [1.6, 1.3, 0.4], () => openPanel('photoStory'));

  const coupleFrame = await framedPhoto(panelData.photoCouple.photoUrl, 1.15, 0.85);
  coupleFrame.position.set(2.2, 2.35, -ROOM_D / 2 + 0.22);
  room.add(coupleFrame);
  makeInteractive(coupleFrame, [1.6, 1.3, 0.4], () => openPanel('photoCouple'));

  // Pulsing halo di sekitar tiap objek interaktif — penanda "boleh disentuh"
  interactives.forEach(({ hitbox }) => {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(Math.max(hitSizeRadius(hitbox)) , 0.035, 10, 40),
      new THREE.MeshBasicMaterial({ color: '#ffd166', transparent: true, opacity: 0.85 })
    );
    ring.name = 'pulseRing';
    hitbox.add(ring);
    // Ring orientasinya menghadap depan-kamera-ish: datarkan saja horizontal
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -(hitbox.geometry.parameters.height / 2) + 0.05;
  });

  animate();
})();

function hitSizeRadius(hitbox) {
  const p = hitbox.geometry.parameters;
  return Math.max(p.width, p.depth) / 2 + 0.15;
}

/* ================= Kontrol sentuh / mouse ================= */

const look = new THREE.Vector3(0, 1.5, 0.6); // titik pandang: tengah ruangan
let yaw = 0, pitch = 0.32, dist = 9.2;
const DIST_MIN = 5.5, DIST_MAX = 13;
let velYaw = 0, velPitch = 0; // inersia

function applyCamera() {
  pitch = Math.max(-0.15, Math.min(1.1, pitch));
  camera.position.set(
    look.x + dist * Math.cos(pitch) * Math.sin(yaw),
    look.y + dist * Math.sin(pitch),
    look.z + dist * Math.cos(pitch) * Math.cos(yaw)
  );
  camera.lookAt(look);
}
applyCamera();

// --- Pointer events (menyatukan mouse & sentuh) ---
const pointers = new Map(); // pointerId → {x, y}
let pinchDist = 0;
let downPos = null, movedFar = false;
const TAP_SLOP = 12; // px — gerakan di bawah ini dianggap tap

stage.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stage.classList.add('dragging');
  if (pointers.size === 1) { downPos = { x: e.clientX, y: e.clientY }; movedFar = false; }
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});

stage.addEventListener('pointermove', (e) => {
  const prev = pointers.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > TAP_SLOP) movedFar = true;

  if (pointers.size === 1) {
    // Drag = putar pandangan (dengan inersia ringan)
    velYaw = dx * 0.0042;
    velPitch = dy * 0.0028;
    yaw += velYaw;
    pitch += velPitch;
    applyCamera();
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) {
      dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * (pinchDist / d)));
      applyCamera();
    }
    pinchDist = d;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchDist = 0;
  if (pointers.size === 0) {
    stage.classList.remove('dragging');
    // Tap = buka objek yang kena
    if (!movedFar && downPos) tryPick(downPos.x, downPos.y);
    downPos = null;
  }
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('pointerleave', (e) => {
  if (pointers.has(e.pointerId)) endPointer(e);
});

// Wheel zoom (desktop)
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  dist = Math.max(DIST_MIN, Math.min(DIST_MAX, dist * (1 + Math.sign(e.deltaY) * 0.08)));
  applyCamera();
}, { passive: false });

/* ---- Raycast pick ---- */

const ndc = new THREE.Vector2();
function tryPick(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(interactives.map((i) => i.hitbox), false);
  if (hits.length) {
    const entry = interactives.find((i) => i.hitbox === hits[0].object);
    if (entry) entry.onClick();
  }
}

/* ================= Loop animasi ================= */

const clock = new THREE.Clock();
const pulseMats = [];

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // Inersia drag
  if (pointers.size === 0) {
    velYaw *= 0.93; velPitch *= 0.93;
    if (Math.abs(velYaw) > 1e-4 || Math.abs(velPitch) > 1e-4) {
      yaw += velYaw; pitch += velPitch;
      applyCamera();
    }
  }

  // Awan mengapung pelan
  cloudGroup.children.forEach((cloud, i) => {
    cloud.position.y = cloud.userData.baseY + Math.sin(t * 0.7 + i * 2.1) * 0.12;
    cloud.rotation.y = Math.sin(t * 0.3 + i) * 0.15;
  });

  // Halo pulsing di objek interaktif
  scene.traverse((o) => {
    if (o.name === 'pulseRing') {
      const s = 1 + Math.sin(t * 3 + o.parent.id) * 0.12;
      o.scale.set(s, s, s);
    }
  });

  renderer.render(scene, camera);
}

/* ================= Resize ================= */

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ================= Enter ================= */

document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hidden');
});
</script>
