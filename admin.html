<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<!-- noindex: halaman ini bukan untuk dicari mesin — yang menjaganya adalah
     Supabase Auth + RLS, bukan "bersembunyi", tapi tidak ada alasan untuk
     menampilkannya di hasil pencarian. -->
<meta name="robots" content="noindex">
<title>Admin — Mita &amp; Andi</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<!-- Tipografi panel: Geist (UI) + Geist Mono (kicker/label/angka). Fallback
     sistem sudah lengkap di panel.css kalau Google Fonts tak terjangkau. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>

<!-- ============ LAYAR LOGIN ============ -->
<div id="login-screen" class="p-login-screen">
  <form id="login-form" class="p-login-card">
    <div class="p-brand">
      <span class="p-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="12" r="5.5"/><circle cx="14.5" cy="12" r="5.5"/></svg></span>
      <span class="p-brand__text"><span class="p-brand__name">Nikahku</span><span class="p-brand__sub">Panel Admin</span></span>
    </div>
    <h1>Masuk ke panel.</h1>
    <p class="p-hint">Mita &amp; Andi — The Wedding</p>
    <label>
      Email admin
      <input class="p-input" type="email" id="login-username" autocomplete="username" required>
    </label>
    <label>
      Kata sandi
      <input class="p-input" type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="p-btn p-btn--primary" id="login-submit">Masuk</button>
    <p id="login-error" class="p-login-error" role="alert"></p>
  </form>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" hidden>
  <!-- Kepala frame sticky: topbar (hamburger HP + merek + slug + status
       publikasi + ⋯) dan STRIP BAB — jalur navigasi utama, satu chip-row
       horizontal di semua viewport. Dirender router.js (renderStrip).
       Tombol Keluar hidup di menu ⋯ dan wajib ber-id btn-logout (di-bind
       core.js initAdminAuth saat load, jadi harus statis di markup ini). -->
  <div class="p-framehead">
    <header class="p-topbar">
      <button type="button" class="p-menubtn" id="p-menu-btn" aria-controls="p-sidebar" aria-expanded="false" aria-label="Buka menu navigasi">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="p-brand">
        <span class="p-brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9.5" cy="12" r="5.5"/><circle cx="14.5" cy="12" r="5.5"/></svg></span>
        <span class="p-brand__text"><span class="p-brand__name">Nikahku</span><span class="p-brand__sub">Panel Admin</span></span>
      </div>
      <span class="p-chip p-topbar__slug" id="p-topbar-slug"></span>
      <div class="p-topbar__side">
        <button type="button" class="p-pubpill" id="p-pubpill" data-nav-key="home" hidden></button>
        <details class="p-topmenu" id="p-topmenu">
          <summary class="p-topmenu__btn" aria-label="Menu lainnya">&#8943;</summary>
          <div class="p-topmenu__sheet">
            <button type="button" id="p-menu-preview">Pratinjau draft</button>
            <button type="button" id="p-menu-password">Ganti Password</button>
            <button type="button" id="btn-logout">Keluar</button>
          </div>
        </details>
      </div>
    </header>
    <nav class="p-chapters" id="p-chapters" aria-label="Bab undangan &amp; alat"></nav>
  </div>

  <!-- Jalur navigasi KEDUA: sidebar parent-child (router.js renderSidebar).
       ≥1024px kolom permanen; di bawahnya drawer dari kiri via hamburger.
       Isi #p-sidebar-nav dirender JS karena butuh daftar halaman. -->
  <div class="p-body">
    <aside class="p-sidebar" id="p-sidebar" aria-label="Navigasi panel">
      <nav id="p-sidebar-nav"></nav>
    </aside>

    <main class="p-outlet" id="p-outlet">
      <header class="p-stage" id="p-stage"></header>
      <div class="p-outlet__inner" id="p-outlet-inner"></div>
    </main>
  </div>

  <!-- Penutup drawer sidebar (HP) — menutupi framehead juga. -->
  <div class="p-scrim" id="p-scrim"></div>

  <div class="p-savebar" id="p-savebar" hidden>
    <span class="p-savebar__status">Ada perubahan belum disimpan.</span>
    <button type="button" class="p-btn p-btn--primary" id="p-savebar-btn">Simpan</button>
  </div>
</div>

<!-- ============ EDITOR PAN/ZOOM (overlay, dipakai komponen foto) ============ -->
<div id="p-editor" class="p-editor" hidden>
  <div class="p-editor__panel">
    <div class="p-editor__header">
      <h2>Atur pan &amp; zoom</h2>
      <button type="button" class="p-btn p-btn--ghost" id="p-editor-close">Tutup</button>
    </div>
    <div class="p-editor__preview-wrap">
      <div class="p-editor__preview" id="p-editor-preview">
        <img id="p-editor-img" alt="">
      </div>
      <p class="p-editor__hint">Seret foto untuk menggeser (pan)</p>
    </div>
    <label class="p-editor__zoom">
      Zoom
      <input type="range" id="p-editor-zoom" min="1" max="3" step="0.01">
      <span id="p-editor-zoom-value"></span>
    </label>
    <div class="p-editor__footer">
      <button type="button" class="p-btn p-btn--ghost" id="p-editor-reset">Reset</button>
      <button type="button" class="p-btn p-btn--primary" id="p-editor-save">Simpan</button>
    </div>
  </div>
</div>

<!-- ============ GANTI PASSWORD (menu ⋯, di-bind router.js) ============
     Modal statis seperti #p-editor: dibuka PanelUI.openModal (focus trap +
     Escape sudah ditangani di sana). Submit memanggil
     AdminAPI.sb.auth.updateUser({ password }) — user sedang login, jadi
     tidak perlu password lama. -->
<div id="p-passwd-modal" class="p-modal" hidden>
  <form class="p-modal__panel" id="p-passwd-form">
    <div class="p-modal__header">
      <h3>Ganti Password</h3>
      <button type="button" class="p-modal__close" id="p-passwd-close" aria-label="Tutup">&times;</button>
    </div>
    <label class="p-field">
      <span>Password baru</span>
      <input class="p-input" type="password" id="p-passwd-new" autocomplete="new-password" required>
    </label>
    <label class="p-field">
      <span>Konfirmasi password baru</span>
      <input class="p-input" type="password" id="p-passwd-confirm" autocomplete="new-password" required>
    </label>
    <p class="p-hint">Minimal 8 karakter. Kamu tetap masuk dengan perangkat ini setelah password diganti.</p>
    <p class="p-warning p-warning--danger" id="p-passwd-error" hidden></p>
    <div style="display:flex; gap:12px; margin-top:16px">
      <button type="submit" class="p-btn p-btn--primary" id="p-passwd-save">Simpan password</button>
      <button type="button" class="p-btn p-btn--ghost" id="p-passwd-cancel">Batal</button>
    </div>
  </form>
</div>

<div id="toast" class="p-toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/tenant.js"></script>
<!-- Tata letak grid galeri, dipakai bersama halaman undangan. -->
<script src="assets/js/gallery-layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/panel/core.js"></script>
<script src="assets/js/panel/ui.js"></script>
<script src="assets/js/panel/store.js"></script>
<script src="assets/js/panel/photos.js"></script>
<script src="assets/js/panel/router.js"></script>

<!-- Satu file per halaman (kontrak §6.3 rencana v2) — urutan di sini
     SAMA PERSIS dengan urutan bab/alat di strip (lihat CHAPTERS & TOOLS di
     router.js). -->
<script src="assets/js/panel/pages/home.js"></script>
<script src="assets/js/panel/pages/cover.js"></script>
<script src="assets/js/panel/pages/mempelai.js"></script>
<script src="assets/js/panel/pages/pembuka.js"></script>
<script src="assets/js/panel/pages/acara.js"></script>
<script src="assets/js/panel/pages/cerita.js"></script>
<script src="assets/js/panel/pages/galeri.js"></script>
<script src="assets/js/panel/pages/hadiah.js"></script>
<script src="assets/js/panel/pages/livestream.js"></script>
<script src="assets/js/panel/pages/penutup.js"></script>
<script src="assets/js/panel/pages/sapaan.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/js/panel/pages/kontak.js"></script>
<script src="assets/js/panel/pages/kado.js"></script>
<script src="assets/js/panel/pages/ucapan.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="assets/js/panel/pages/template.js"></script>
<script src="assets/js/panel/pages/warna.js"></script>
<script src="assets/js/panel/pages/font.js"></script>
<script src="assets/js/visual-editor/registry.js"></script>
<script src="assets/js/panel/pages/editor-visual.js"></script>
<script src="assets/js/panel/pages/pengaturan.js"></script>
<script src="assets/js/panel/pages/admin-akun.js"></script>

<script>
(function () {
  async function boot() {
    document.getElementById("p-topbar-slug").textContent = "/" + window.AdminAPI.tenant.slug + "/";
    try {
      await window.PanelStore.load();
      window.PanelRouter.start();
    } catch (err) {
      // Store.load() gagal (mis. jaringan) sebelum router sempat jalan —
      // tampilkan jalan keluar yang jelas, bukan layar app kosong tanpa
      // penjelasan (initAdminAuth memanggil onSignedIn tanpa menunggunya).
      document.getElementById("p-outlet-inner").innerHTML =
        '<div class="p-warning p-warning--danger">Gagal memuat data undangan: ' +
        window.PanelUI.esc(err && err.message ? err.message : err) +
        '</div><button type="button" class="p-btn p-btn--primary" id="p-boot-retry" style="margin-top:12px">Coba lagi</button>';
      document.getElementById("p-boot-retry").addEventListener("click", boot);
    }
  }
  window.AdminShared.initAdminAuth({ onSignedIn: boot });
})();
</script>
</body>
</html>
