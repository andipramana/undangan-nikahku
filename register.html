<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><meta name="robots" content="noindex"><title>Daftarkan Undangan</title><link rel="icon" type="image/png" href="assets/img/favicon.png"><link rel="stylesheet" href="assets/css/admin.css"></head>
<body><div class="app-frame"><div class="app-frame__scroll"><main class="login-screen" style="min-height:100%"><form id="register-form" class="login-card"><h1>Daftarkan Undangan</h1><p class="login-hint">Khusus admin root.</p>
<label>Email admin root<input id="owner-email" type="email" required autocomplete="username"></label><label>Password admin root<input id="owner-password" type="password" required autocomplete="current-password"></label>
<hr><label>Slug path<input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="siti-dan-ujang"></label><label>Nama mempelai wanita<input id="bride-name" required placeholder="Siti"></label><label>Nama mempelai pria<input id="groom-name" required placeholder="Ujang"></label><label>Nama pasangan / judul<input id="display-name" required placeholder="Siti & Ujang"></label>
<label>Email admin undangan<input id="admin-email" type="email" required></label><label>Password admin undangan<input id="admin-password" type="password" minlength="8" required></label>
<label>Email admin QR<input id="qr-email" type="email" required></label><label>Password admin QR<input id="qr-password" type="password" minlength="8" required></label>
<div class="register-actions"><button id="submit" class="btn btn--primary" type="submit">Buat undangan</button><button id="clients-open" class="btn btn--ghost" type="button">Lihat daftar client</button></div><p id="message" class="login-error" role="alert"></p><div id="result" hidden></div></form><section id="clients-panel" class="login-card clients-panel" hidden><div class="clients-panel__head"><div><h2>Daftar client</h2><p class="login-hint">Kelola undangan, akun Admin, dan Admin QR.</p></div><button type="button" class="btn btn--ghost" id="clients-refresh">↻ Refresh</button></div><div id="clients-list"></div></section></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="assets/js/config.js"></script><script src="assets/js/register.js"></script></body></html>
