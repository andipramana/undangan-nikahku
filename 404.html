<script>
  // GitHub Pages has no server rewrite. Preserve the requested tenant route and
  // load the one static application shell that knows how to resolve it.
  (function () {
    var target = location.pathname + location.search + location.hash;
    location.replace('/index.html?__tenant_route=' + encodeURIComponent(target));
  })();
</script>
