<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<!-- noindex: halaman ini bukan untuk dicari mesin — yang menjaganya adalah
     Supabase Auth + RLS, bukan "bersembunyi", tapi tidak ada alasan untuk
     menampilkannya di hasil pencarian. -->
<meta name="robots" content="noindex">
<title>Check-in — Mita &amp; Andi</title>
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/panel.css">
</head>
<body>

<!-- ============ LAYAR LOGIN ============ -->
<!-- Struktur id sama persis dengan admin.html — shared.js/core.js menanganinya. -->
<div id="login-screen" class="p-login-screen">
  <form id="login-form" class="p-login-card">
    <p class="p-kicker">Check-in Tamu</p>
    <h1>Masuk untuk memindai.</h1>
    <p class="p-hint">Mita &amp; Andi — The Wedding</p>
    <label>
      Email admin
      <input class="p-input" type="email" id="login-username" autocomplete="username" required>
    </label>
    <label>
      Kata sandi
      <input class="p-input" type="password" id="login-password" autocomplete="current-password" required>
    </label>
    <button type="submit" class="p-btn p-btn--primary" id="login-submit">Masuk</button>
    <p id="login-error" class="p-login-error" role="alert"></p>
  </form>
</div>

<!-- ============ APLIKASI ============ -->
<div id="app" hidden style="max-width:640px;margin:0 auto;padding:var(--p-4)">
  <header class="p-toolbar" style="margin-bottom:var(--p-4)">
    <h1 style="font-family:var(--p-font-display);font-size:1.4rem;margin:0">Check-in — Mita &amp; Andi</h1>
    <button type="button" class="p-btn p-btn--ghost" id="btn-logout">Keluar</button>
  </header>

  <!-- core.js (dipakai bareng admin.html & wa.html) meng-query-select .tab/
       .panel secara struktural untuk tahu tab mana yang aktif — nama kelas
       ini TIDAK bisa diganti tanpa mengubah core.js. Direstyle dengan token
       panel di bawah, bukan diganti nama. -->
  <nav class="tabs">
    <button type="button" class="tab tab--active" data-tab="checkin">Scan QR</button>
    <button type="button" class="tab" data-tab="livestream">Live Streaming</button>
  </nav>

  <!-- ============ TAB SCAN QR ============ -->
  <main id="tab-checkin" class="panel">
    <div class="p-toolbar">
      <button type="button" class="p-btn p-btn--primary" id="btn-scan">Mulai scan</button>
      <button type="button" class="p-btn p-btn--ghost" id="btn-scan-stop" hidden>Hentikan scan</button>
      <button type="button" class="p-btn p-btn--ghost" id="btn-checkins-refresh">Muat ulang daftar</button>
    </div>
    <!-- Video kamera belakang + status scan. Canvas sengaja tersembunyi —
         hanya dipakai membaca frame untuk jsQR, bukan untuk ditampilkan. -->
    <video id="scan-video" class="scan-video" playsinline muted></video>
    <p id="scan-status" class="scan-status" role="status">Kamera belum dinyalakan.</p>
    <canvas id="scan-canvas" hidden></canvas>
    <div id="checkins-root" style="margin-top:1.25rem"></div>
  </main>

  <!-- ============ TAB LIVE STREAMING ============ -->
  <!-- Form ini satu-satunya yang boleh diubah akun admin-qr (RLS migration
       0004: dengan check hanya mengizinkan key `livestream` berubah).
       Disimpan via shared.saveLivestream — SELECT → ubah → UPSERT. -->
  <main id="tab-livestream" class="panel" hidden>
    <section class="p-card">
      <h2 class="p-card__title">Link siaran langsung</h2>
      <p class="p-card__desc">URL kosong = platform itu tidak ditampilkan; kosongkan semuanya untuk menyembunyikan section Live Streaming di undangan.</p>
      <div class="p-grid-2">
        <label class="p-field">
          <span>YouTube</span>
          <input class="p-input" type="url" id="f-live-youtube" placeholder="https://youtube.com/…">
        </label>
        <label class="p-field">
          <span>Instagram</span>
          <input class="p-input" type="url" id="f-live-instagram" placeholder="https://instagram.com/…">
        </label>
      </div>
      <label class="p-field">
        <span>TikTok</span>
        <input class="p-input" type="url" id="f-live-tiktok" placeholder="https://tiktok.com/…">
      </label>
      <button type="button" class="p-btn p-btn--primary" id="btn-save-livestream">Simpan</button>
    </section>
  </main>
</div>

<div id="toast" class="p-toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/tenant.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/admin/shared.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="assets/js/admin/admin-qr.js"></script>
</body>
</html>
